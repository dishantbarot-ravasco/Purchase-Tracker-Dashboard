# Render Blueprint for the Purchase Tracker Dashboard.
# Deploy: connect this repo in the Render dashboard as a Blueprint, or run
# `render blueprint launch`. Both services are pinned to the starter plan
# (Render's "starter" is a legacy alias Render still accepts for web/worker
# services and maps to its current compute-plan IDs - no need to write the
# new IDs directly). The database is on basic-256mb instead - see that
# block's own comment for why 'starter' is rejected there specifically.
#
# Secrets (sync: false below) are NOT set here - Render prompts for them once
# at blueprint creation, and updating them afterwards means Dashboard ->
# service -> Environment. Non-secret config (Drive folder ids, SMTP host,
# etc.) is filled in directly from .env.example so a fresh deploy needs the
# fewest possible manual steps.

databases:
  - name: purchase-tracker-db
    databaseName: purchase_tracker
    user: purchase_tracker
    # 'starter' (and every other legacy Postgres plan slug) is REJECTED by
    # Render for new databases ("Legacy Postgres plans ... no longer
    # supported") - Postgres plan slugs are size-suffixed and namespaced
    # separately from web-service plan slugs (a service's own plan: starter
    # just below is unaffected, that error is database-specific). basic-256mb
    # is the same tier the sibling TDS Automation App already runs production
    # traffic on (same Ravasco Render account) - this app's own data (POs/
    # MIR/Stock across 3 plants, growing daily snapshot history) is a
    # comparably small dataset, well under this tier's storage. Render bills
    # storage separately from instance type and supports upgrading the
    # instance type later from the dashboard (brief downtime, no migration
    # needed) - a safe, reversible starting point, not a permanent ceiling.
    plan: basic-256mb

services:
  - type: web
    name: purchase-tracker-dashboard
    # Docker since 2026-09-23 (was `runtime: python`). Changing the runtime of
    # an EXISTING service is supported through a Blueprint sync, so this keeps
    # the service - and its "-pqgi" hostname, which ALLOWED_HOSTS and the
    # OAuth redirect below are pinned to. Recreating the service instead would
    # hand out a new hostname and break Google sign-in until both are updated.
    #
    # The Dockerfile pins the interpreter (python:3.12-slim + UV_PYTHON), which
    # retires the old native-runtime workaround: PYTHON_VERSION plus
    # `--python 3.12` on every `uv` call, needed because Render's native build
    # could not satisfy this repo's .python-version (3.14) and crash-looped on
    # "No interpreter found for Python 3.14" when one call was left unpinned.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /
    # Migrate + ensure_schedules + createcachetable, once per deploy, after the
    # image builds and before the new version takes traffic - a failure here
    # aborts the deploy and the old version keeps serving, same as a failed
    # buildCommand used to. Web service ONLY, deliberately: the worker below
    # does not run it, so the two services never migrate the shared Postgres
    # at the same moment. No dockerCommand here - the Dockerfile's CMD
    # (gunicorn on $PORT, 2 workers) is the web default.
    preDeployCommand: /app/release.sh
    envVars:
      # ── Django core ──────────────────────────────────────────────────────
      # Generated ONCE here - the qcluster worker below does NOT generate
      # its own copy; it references this exact value via `fromService`
      # instead (see that block's own comment for why this one specific
      # value, unlike JWT_SIGNING_KEY, cannot be independently generated per
      # service). A real bug, found from a live deploy (2026-09-08):
      # DJANGO_SECRET_KEY used to be `generateValue: true` independently in
      # BOTH services - two different random values. django-q2's ORM broker
      # signs every queued task with `settings.SECRET_KEY`
      # (django_q/conf.py) before writing it to the shared Postgres queue -
      # the web service enqueues a sync task signed with its own key, then
      # qcluster tries to verify it with a *different* key and fails with
      # `django.core.signing.BadSignature` on every single task, forever
      # (confirmed against the actual qcluster log: "Failed to push task to
      # queue" / "Signature ... does not match", repeating). An earlier fix
      # attempt used a top-level `envVarGroups:` block with `generateValue`
      # inside it - Render's Blueprint sync rejected that combination
      # outright ("problems syncing with your Blueprint file"), so this
      # uses `fromService` instead, which is Render's documented mechanism
      # for one service to read a specific value straight off another.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Pinned to this service's OWN hostname (2026-09-15, audit pass).
      # `.onrender.com` matched EVERY Render-hosted subdomain, i.e. every other
      # Render customer's hostname too - so Django's Host-header validation,
      # whose entire job is rejecting a request that claims to be for a domain
      # this app does not serve, was effectively disabled. Nothing in this app
      # builds an absolute URL from the request host today (verified: no
      # build_absolute_uri()/get_host() call sites anywhere), so there is no
      # known live exploit - but ALLOWED_HOSTS is a cheap guard that only works
      # if it is actually narrow, and the hostname below is already hardcoded a
      # few lines down in GOOGLE_OAUTH_REDIRECT_URI anyway.
      #
      # If this service is ever renamed/recreated, update BOTH this value and
      # GOOGLE_OAUTH_REDIRECT_URI to Render's newly-assigned hostname - a
      # mismatch here surfaces as a blanket HTTP 400 "Bad Request (Invalid
      # HTTP_HOST header)" on every request, not a subtle failure.
      - key: DJANGO_ALLOWED_HOSTS
        value: purchase-tracker-dashboard-pqgi.onrender.com
      - key: JWT_SIGNING_KEY
        generateValue: true

      # ── Database (discrete PG* vars are unused once DATABASE_URL is set,
      #    left out on purpose - see config/settings.py) ────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: purchase-tracker-db
          property: connectionString

      # ── Auth ─────────────────────────────────────────────────────────────
      - key: ALLOWED_EMAIL_DOMAIN
        value: ravasco.com

      # ── Google Drive service account (unattended sync jobs) - paste the
      #    key JSON as ONE line when prompted. GOOGLE_SERVICE_ACCOUNT_FILE is
      #    omitted: Render's filesystem is ephemeral, so a key *file* isn't a
      #    workable option here, only the JSON env var is. ──────────────────
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── Drive folder ids (not secret - already documented in
      #    .env.example / CLAUDE.md) ───────────────────────────────────────
      - key: PURCHASE_TRACKER_DB_FOLDER_ID
        value: 17cP2suZv26IAU5mqSKyC8U9zL0EysF9a
      - key: HRS_MIR_STOCK_FOLDER_ID
        value: 1mmZrMukdhuYyHQGEfH6ci_LIiNOEQ8Qp
      - key: ACHHAD_MIR_STOCK_FOLDER_ID
        value: 1mviBKPDyZLVLfGVZ780BX_xPR9fLxdtH
      - key: VAPI_MIR_STOCK_FOLDER_ID
        value: 1kzWf8sf9UfXBG34WalJxgu7djX5fwNUU
      - key: RODTEP_FOLDER_ID
        value: 16gdQxPCDutLTxZ2oiX1M1TCi64kjnEnq
      - key: ADVANCE_LICENSE_FILE_ID
        value: 1zqxUwxUn2fpftBUJhqjjfRmzjgkob0rb2U11VRXudX4

      # ── SMTP (login OTP / new-device emails) ────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # ── Google OAuth ("Sign in with Google") - a separate client from the
      #    service account above. Update GOOGLE_OAUTH_REDIRECT_URI once the
      #    service's real onrender.com hostname (or custom domain) is known,
      #    and add the same URI to the OAuth client's authorized redirects
      #    in Google Cloud Console. ─────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        # Real deployed hostname carries a "-pqgi" suffix Render appended
        # (the plain "purchase-tracker-dashboard.onrender.com" name was
        # already taken) - confirmed against the live service 2026-09-09
        # after this exact mismatch caused a real redirect_uri_mismatch
        # error on Google's consent screen. If this service is ever
        # recreated under a different name, update this to match Render's
        # actual assigned hostname, not the service `name:` above.
        value: https://purchase-tracker-dashboard-pqgi.onrender.com/api/auth/google/callback/

      # ── SafeCube (Sinay) Container Tracking API - powers the Import
      #    Purchases page's BL-number "Track" links (apps/services/
      #    bl_tracking.py). Web-service only - qcluster never calls it.
      #    Blank is safe (feature reports "not configured" instead of
      #    breaking), but a real key already lives in local .env, so set
      #    the real value here too or the feature silently stops working
      #    once deployed. ──────────────────────────────────────────────────
      - key: SAFECUBE_API_KEY
        sync: false

      # ── Report cron triggers - a free external scheduler (cron-job.org)
      #    hits three separate endpoints with this value as ?secret=... or
      #    an X-Report-Secret header, one cron-job.org job per endpoint:
      #      POST /api/internal/send-daily-report     - once a day, e.g. 20:30 IST
      #      POST /api/internal/send-monthly-report    - once a month, 1st, e.g. 10:00 IST
      #      POST /api/internal/send-mismatch-report   - whatever cadence you want, e.g. 10:30 IST daily
      #    generateValue gives every deploy a real, non-empty secret with no
      #    manual step - copy the generated value from Dashboard -> service
      #    -> Environment into each cron-job.org job config once, after the
      #    first deploy. See CLAUDE.md's "Outgoing email inventory" for what
      #    each report actually contains/who it goes to. ────────────────────
      - key: REPORT_CRON_SECRET
        generateValue: true

      # ── Sentry error tracking (added 2026-09-09) - real-time visibility
      #    into failures across BOTH this web service and the qcluster
      #    worker below (same DSN, same "environment" tag: "production").
      #    Blank/absent -> Sentry is simply never initialized (see
      #    config/settings.py's own comment) - set the real DSN from your
      #    Sentry project's Settings -> Client Keys once you have one. ──────
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # Runs the Drive sync/match pipelines queued by apps/services/sync_trigger.py
  # (django-q2's ORM broker - queued tasks are rows in the shared Postgres DB
  # above, not a separate broker). This is a real second OS process, wholly
  # separate from the web service's gunicorn workers - required precisely so
  # a web worker recycle (gunicorn's default 30s --timeout, uncustomized
  # here) can't kill a sync mid-flight the way the old threading.Thread
  # approach could. Without this service actually running, "Refresh Data"
  # queues a task that never executes - it just sits in django_q_ormq until
  # the sync-in-progress cache lock times out, with nothing having synced.
  - type: worker
    name: purchase-tracker-qcluster
    # Same image as the web service (see its runtime comment), different
    # command. No preDeployCommand on purpose - release tasks run once, on the
    # web service. As before the switch, this worker can start the new code a
    # little before the web service's migration finishes; a qcluster task
    # touching a not-yet-migrated table fails and is retried by the next
    # scheduled run, the same exposure the native runtime had.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python manage.py qcluster
    plan: starter
    region: oregon
    branch: main
    envVars:
      # Reads the WEB service's own generated DJANGO_SECRET_KEY directly,
      # rather than generating an independent value here - see that key's
      # own comment on the web service above for the full reasoning
      # (django-q2's ORM broker signs every queued task with this value;
      # the web service enqueues, this worker dequeues, from the same
      # shared Postgres-backed queue, so both MUST agree on the same key).
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: purchase-tracker-dashboard
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: purchase-tracker-dashboard-pqgi.onrender.com
      # Reads the WEB service's JWT_SIGNING_KEY rather than generating an
      # independent one (2026-09-15, audit pass) - the exact bug shape already
      # fixed for DJANGO_SECRET_KEY just above, which this had quietly kept.
      # Two `generateValue: true` entries for the same logical key produce two
      # DIFFERENT random values, so a JWT minted in one process cannot be
      # verified in the other. Harmless today only because the worker never
      # mints or validates a token - it runs sync/match pipelines and sends
      # report emails. It stops being harmless the moment any queued task, any
      # scheduled report, or any future worker-side endpoint needs to issue or
      # check one, and it would fail as a confusing "signature does not match"
      # rather than an obvious misconfiguration. Same fix, same reason: one
      # generated value, referenced by the other service.
      - key: JWT_SIGNING_KEY
        fromService:
          type: web
          name: purchase-tracker-dashboard
          envVarKey: JWT_SIGNING_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: purchase-tracker-db
          property: connectionString
      - key: ALLOWED_EMAIL_DOMAIN
        value: ravasco.com
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PURCHASE_TRACKER_DB_FOLDER_ID
        value: 17cP2suZv26IAU5mqSKyC8U9zL0EysF9a
      - key: HRS_MIR_STOCK_FOLDER_ID
        value: 1mmZrMukdhuYyHQGEfH6ci_LIiNOEQ8Qp
      - key: ACHHAD_MIR_STOCK_FOLDER_ID
        value: 1mviBKPDyZLVLfGVZ780BX_xPR9fLxdtH
      - key: VAPI_MIR_STOCK_FOLDER_ID
        value: 1kzWf8sf9UfXBG34WalJxgu7djX5fwNUU
      - key: RODTEP_FOLDER_ID
        value: 16gdQxPCDutLTxZ2oiX1M1TCi64kjnEnq
      - key: ADVANCE_LICENSE_FILE_ID
        value: 1zqxUwxUn2fpftBUJhqjjfRmzjgkob0rb2U11VRXudX4
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Same Sentry DSN as the web service above - see that block's own
      # comment. Set to the SAME value on both services (Render doesn't
      # share env vars across services automatically - copy it manually).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
