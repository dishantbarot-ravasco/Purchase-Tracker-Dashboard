[project]
name = "purchase-tracker-dashboard"
version = "0.1.0"
description = "Purchase Tracker Dashboard - PO / MIR / RM Stock reconciliation for Ravasco plants (HRS first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<7.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "gunicorn>=23.0",
    "openpyxl>=3.1",
    "djangorestframework-simplejwt>=5.5.1",
    "bcrypt>=5.0.0",
    "dj-database-url>=3.1.2",
    "google-auth-oauthlib>=1.4.1",
    "requests>=2.34.2",
    "django-q2>=1.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "test_*.py"
addopts = "--reuse-db"
