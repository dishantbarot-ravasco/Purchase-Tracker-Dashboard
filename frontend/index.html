{% load static %}
<!-- frontend/index.html - the real PO<->MIR<->Stock reconciliation dashboard
     ("/"), rendered entirely client-side by js/main.js into #root below. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Applies a stored theme choice before first paint - see js/auth.js's
       initThemeToggle()/applyTheme() for the toggle this pairs with. -->
  <script src="{% static 'js/theme-init.js' %}"></script>
  <link rel="icon" type="image/png" href="{% static 'img/indus_logo.png' %}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Tracker Dashboard</title>
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" crossorigin="anonymous" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi"></script>
</head>
<body>
  <!-- Skip link (2026-09-15, audit pass). Every page puts a multi-tab nav
       before its content, so a keyboard or screen-reader user had to Tab
       through the whole nav on every single page load to reach the actual
       dashboard. Visually hidden until focused (.sr-only-focusable in
       brand.css), so nothing changes for a mouse user. -->
  <a class="sr-only sr-only-focusable skip-link" href="#root">Skip to main content</a>
  <!-- Shared top nav (brand.css) - same on home.html/search-po.html/admin.html,
       see js/auth.js's renderNavTabs(). Everything below this is the
       dashboard's own content (js/main.js), on its own stylesheet. -->
  <nav class="topnav">
    <a href="/home.html" class="nav-brand">
      <img src="{% static 'img/indus_logo.png' %}" alt="Ravasco" class="nav-logo" data-hide-on-error>
      <div class="nav-brand-text">
        <h1>Purchase Tracker</h1>
        <p>Ravasco Transmission &amp; Packing</p>
      </div>
    </a>
    <div class="nav-tabs" id="navTabs"></div>
    <div class="nav-spacer"></div>
    <div class="nav-user" id="navUser"></div>
  </nav>

  <!-- #root's entire contents are replaced by main.js once data loads - the
       spinner below is only ever seen briefly on first paint. -->
  <div class="wrap" id="root" role="main" tabindex="-1">
    <div class="load-banner"><div class="spinner"></div><div>Loading&hellip;</div></div>
  </div>

  <!-- Shared modal shell for PO/material detail - main.js swaps #modalBody's
       innerHTML per open() call rather than templating a new modal each time. -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBody"></div>
  </div>

  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/shared.js' %}"></script>
  <!-- main.js was split into these per-concern modules 2026-09-04 (see
       main.js's own header comment for what's in each) - order matters:
       every file here must load before main.js, since main.js's init()
       (bottom of that file) is the entry point and reaches into all of
       them via plain shared globals (no bundler, no ES modules). -->
  <script src="{% static 'js/charts.js' %}"></script>
  <script src="{% static 'js/flags.js' %}"></script>
  <script src="{% static 'js/po-list.js' %}"></script>
  <script src="{% static 'js/po-reconcile.js' %}"></script>
  <script src="{% static 'js/po-modal.js' %}"></script>
  <script src="{% static 'js/import-po.js' %}"></script>
  <script src="{% static 'js/rodtep-panel.js' %}"></script>
  <script src="{% static 'js/advance-license-panel.js' %}"></script>
  <script src="{% static 'js/materials.js' %}"></script>
  <script src="{% static 'js/material-modal.js' %}"></script>
  <script src="{% static 'js/export-panel.js' %}"></script>
  <script src="{% static 'js/no-po-panel.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
