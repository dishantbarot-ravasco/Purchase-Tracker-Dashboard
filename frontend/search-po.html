<!--
  search-po.html - Look up a purchase order by PO number across all 3
  plants (HRS / RTP-Achhad / RTP-Vapi), without going through the plant
  selector on the main dashboard first. New page, brand.css-styled to match
  home.html/index.html's shared topnav (see js/auth.js's renderNavTabs()).

  Deliberately self-contained rather than depending on js/main.js's PO cache
  or its full modal (which needs the dashboard's own #root/#modalBackdrop
  DOM and internal `state` object) - this page fetches and caches its own
  copy of each plant's purchase orders, and the result detail panel shows
  the essentials (vendor, value, status, line items, remarks) but not the
  dashboard's full match-confidence/flag-badge treatment. That's a real,
  disclosed simplification (see the detail panel's own comment below), not
  an oversight - a full-parity detail view already exists at "/" (this page
  links there for anyone who needs it).

  Protected page: requireAuth() (js/auth.js) redirects to /login.html if
  there's no active session.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Applies a stored theme choice before first paint - see js/auth.js's
       initThemeToggle()/applyTheme() for the toggle this pairs with. -->
  <script src="js/theme-init.js"></script>
  <link rel="icon" type="image/png" href="img/indus_logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search PO - Purchase Tracker</title>
  <link rel="stylesheet" href="css/brand.css">
  <style>
    .detail-panel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 28px; margin-top: 20px; box-shadow: var(--shadow-sm);
    }
    .detail-close { float: right; cursor: pointer; font-size: 22px; color: var(--text-muted); line-height: 1; }
    .detail-close:hover { color: var(--navy); }
    .detail-title { font-family: var(--font-head); font-size: 20px; font-weight: 900; color: var(--navy); }
    .detail-meta { font-size: 12.5px; color: var(--text-muted); margin: 6px 0 18px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
    .detail-block h4 { font-family: var(--font-head); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 8px; }
    .detail-block .line { font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .items-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .items-table th, .items-table td { padding: 9px 12px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border); }
    .items-table th { font-family: var(--font-head); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); background: var(--bg-section); }
    .status-pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .status-pill.matched { background: var(--green-pale); color: var(--green); }
    .status-pill.unmatched { background: var(--bg-section); color: var(--text-muted); }
    @media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="home.html" class="nav-brand">
      <img src="img/indus_logo.png" alt="Ravasco" class="nav-logo" data-hide-on-error>
      <div class="nav-brand-text">
        <h1>Purchase Tracker</h1>
        <p>Ravasco Transmission &amp; Packing</p>
      </div>
    </a>
    <div class="nav-tabs" id="navTabs"></div>
    <div class="nav-spacer"></div>
    <div class="nav-user" id="navUser"></div>
  </nav>

  <div class="page-wrap">
    <div class="section-title">Search Purchase Orders</div>
    <div class="search-box">
      <input type="text" class="form-control" id="searchInput" placeholder="Enter a PO number (e.g. 3000001104, HRS/HO/26-27/003)&hellip;" autofocus>
      <button type="button" class="btn btn-primary" id="searchBtn">Search</button>
    </div>

    <div id="resultsArea"></div>
    <div id="detailArea"></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/search-po-page.js"></script>
</body>
</html>
