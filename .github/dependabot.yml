# Continuous dependency-vulnerability monitoring, on top of (not instead of)
# CI's own pip-audit step (.github/workflows/ci.yml) - pip-audit only checks
# whatever's pinned at the moment CI runs; a CVE disclosed against an
# already-merged pin sits undetected until the next push otherwise.
# Dependabot checks on its own schedule regardless of push activity and
# opens a PR when a pinned dependency has a known advisory.
# cooldown/default-days (added 2026-09-08, project owner request: "open
# source library will be updated only after 7 days of any new version") -
# Dependabot won't open a PR for a newly-released version until it's been
# out for 7 days, giving the upstream project's own community a window to
# catch/report an immediately-broken or malicious release before this repo
# ever proposes pulling it in. Applies to every version bump Dependabot
# would otherwise open a PR for, regardless of semver level (major/minor/
# patch) - a real CVE fix still lands within the week, just not same-day.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Django MAJOR versions are a deliberate upgrade, not a dependency bump
    # (added 2026-09-23). PR #4 widened pyproject's pin to <7.0 without
    # touching uv.lock, so CI - which installs from the lockfile - passed
    # while never running Django 6 at all, and merging it would have left
    # pyproject and uv.lock disagreeing until the next `uv lock` silently
    # moved the app to 6.x. A major needs its own change: re-lock, grep
    # DRF/simplejwt for new get_user_model() calls (CLAUDE.md, Auth &
    # security), and check for settings the new version silently stops
    # reading (STATICFILES_STORAGE was one - removed in 5.1, ignored here
    # without a warning until CI's docker-image job caught it). Minor and
    # patch releases within the current major still come through.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The Dockerfile's base image (added 2026-09-23, when render.yaml moved to
  # runtime: docker - the OS layer is now ours to patch, not Render's). The
  # FROM line is pinned by digest, so this proposes a new digest of the SAME
  # python:3.12-slim tag as Debian security fixes land. Minor/major Python
  # bumps (3.13, 4.x) are ignored: changing the interpreter is a deliberate
  # decision, not a dependency update - it moves CI's UV_PYTHON with it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
