name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  django:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pt_ci
          POSTGRES_PASSWORD: pt_ci
          POSTGRES_DB: pt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pt_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-not-used-in-production-0123456789
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://pt_ci:pt_ci@localhost:5432/pt_ci
      ALLOWED_EMAIL_DOMAIN: ravasco.com
      # Dummy Drive/Google values so settings.py imports cleanly - no live
      # Drive/OAuth calls happen during makemigrations/migrate/check/test.
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      # Pins the interpreter `uv sync` builds the venv with - UV_PYTHON wins
      # over the repo's .python-version (3.14, a local-dev convenience). 3.12
      # matches render.yaml's PYTHON_VERSION (3.12.8) and the Dockerfile.
      # Fixed 2026-09-23 (audit pass): this used to be `python-version: '3.12'`
      # on the setup-uv step (then @v3), an input v3 did not have - every run
      # logged "Unexpected input(s) 'python-version'", ignored it, and fell
      # back to .python-version, so CI had been testing on 3.14 while
      # production ran 3.12.
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv pip install pip-audit
          uv run pip-audit

      - name: Lint (ruff)
        # A real red/green gate, not an advisory score - the ruleset in
        # pyproject.toml's [tool.ruff.lint] is deliberately narrowed to
        # rules that catch real defects and was driven to ZERO by hand when
        # it was introduced (2026-09-15). See that config block's own
        # comment for why the broad default ruleset is NOT used, and for the
        # live production timezone bug this gate caught on its first run.
        run: uv run ruff check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Production security check
        # A real gate, not advisory - plain `check --deploy` never fails the
        # build on its own (Django's default --fail-level is ERROR, and
        # every deploy check is Warning-level), so a DEBUG=True or
        # dev-default-SECRET_KEY misconfiguration would otherwise pass CI
        # silently. --fail-level WARNING makes it real; security.W003 is
        # silenced deliberately in config/settings.py's SILENCED_SYSTEM_CHECKS
        # (see that setting's own comment) - a JWT-auth API has no need for
        # Django's session CSRF middleware app-wide.
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Run migrations (fresh database)
        run: uv run python manage.py migrate --noinput

      - name: Create cache table
        run: uv run python manage.py createcachetable

      - name: Run test suite (with coverage floor)
        # --cov-fail-under is a RATCHET, not a target. It was set to 90 when
        # coverage was measured at 92% (2026-09-15, audit pass), and raised to
        # 92 when it was measured at 94% (2026-09-23, audit pass), leaving a
        # couple of points of headroom so an ordinary refactor that moves code
        # around does not fail the build - while a change that deletes or
        # bypasses a meaningful chunk of tested code still does. Raise it when
        # coverage genuinely improves; do NOT lower it to make a red build
        # green, which is the one change that turns a ratchet back into a
        # decoration.
        run: uv run pytest --cov=apps --cov=config --cov-report=term --cov-fail-under=92

  frontend-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Zero-config, dependency-free syntax gate - node's own parser, no
      # ESLint install involved. This app's frontend has no build step (see
      # CLAUDE.md), so a real syntax error here means the page's <script>
      # tag fails to load in the browser at all.
      - name: Syntax-check frontend JS modules
        run: |
          for f in frontend/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Lint frontend JS (ESLint)
        # A REAL GATE since 2026-09-23 - a finding fails the build, same as
        # `ruff check .`. It spent its first week non-blocking
        # (continue-on-error) while its baseline was unknown, and that week
        # showed why such a flag must be temporary: every run crashed with
        # exit code 2 (a top-level "//" key in .eslintrc.json that ESLint 8's
        # schema rejects) and the job still reported green. Once the config
        # was fixed, the first genuine run (CI #102, commit 165360b) was clean,
        # so the flag was removed. Don't add it back; fix the finding, or
        # narrow the rule with a recorded reason in .eslintrc.json.
        #
        # `node --check` above catches only unparseable files. This catches
        # what actually bites in a no-bundler codebase: a function declared
        # twice in one file, a duplicated object key, an unreachable branch,
        # `typeof x == 'strng'`, a self-comparison. Config is deliberately
        # narrow - see .eslintrc.json's own notes, in particular WHY no-undef
        # is off (all 14 files share one global scope by design, so ESLint
        # cannot resolve cross-file calls without a drifting globals list).
        run: |
          npx --yes eslint@8 frontend/js --ext .js --max-warnings 0
