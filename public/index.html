<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Same palette/visual language as the Purchase Tracker Cowork artifact,
     kept intentionally simpler here (fewer views, plainer language in
     errors/labels) since this screen is used by non-technical management,
     not just the people who built it. */
  :root {
    color-scheme: light;
    --navy: #0f1b2d;
    --navy-hover: #182a44;
    --on-accent: #ffffff;
    --slate: #1f2937;
    --slate-soft: #475569;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;
    --bg: #f4f6f9;
    --card: #ffffff;
    --gray-soft: #f1f5f9;
    --blue: #2563eb;
    --blue-soft: #eff4ff;
    --red: #dc2626;
    --red-soft: #fef2f2;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --mono: ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 2px 8px rgba(15,23,42,0.05);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--slate); line-height:1.45; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px clamp(12px, 2.5vw, 26px) 60px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .app-title { font-size:26px; margin:0; color:var(--navy); font-weight:800; letter-spacing:-0.015em; }
  .who { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--slate-soft); flex-wrap:wrap; }
  .badge { display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--blue-soft); color:#1e40af; font-weight:700; }
  .btn { border:1px solid var(--navy); background:var(--navy); color:var(--on-accent); padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; box-shadow:var(--shadow); }
  .btn:hover { background:var(--navy-hover); }
  .btn.secondary { background:#fff; color:var(--navy); }
  .btn.secondary:hover { background:var(--blue-soft); }
  .btn.small { padding:5px 12px; font-size:12px; }

  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { padding:10px 20px; cursor:pointer; font-size:13.5px; font-weight:700; border-radius:9px; color:var(--slate-soft); background:var(--card); border:1px solid var(--border); }
  .tab.active { color:var(--on-accent); background:var(--navy); border-color:var(--navy); }

  .load-banner { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:48px 20px; text-align:center; color:var(--slate-soft); font-size:14px; box-shadow:var(--shadow); }
  .spinner { display:inline-block; width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Errors are always short and in plain language - no file paths, no
     Python exception text. Full technical detail only ever goes to
     Render's server-side logs, never to this screen. */
  .notice-banner { background:var(--amber-soft); border:1px solid #fde68a; color:#92400e; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-top:10px; }
  .notice-banner.info { background:var(--blue-soft); border-color:#dbeafe; color:#1e40af; }
  .noaccess { background:var(--amber-soft); border:1px solid #fde68a; border-radius:12px; padding:20px 22px; color:#92400e; font-size:13.5px; }

  .plant-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:16px; }
  .plant-card { background:var(--card); border:1px solid var(--border); border-left:5px solid var(--blue); border-radius:13px; padding:18px 20px; box-shadow:var(--shadow); }
  .plant-name { font-weight:800; font-size:16px; color:var(--navy); margin-bottom:14px; }
  .stat-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .stat .val { font-family:var(--mono); font-size:24px; font-weight:800; color:var(--navy); font-variant-numeric: tabular-nums; }
  .stat .label { font-size:10.5px; color:var(--slate-soft); margin-top:4px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }

  .signin-screen { text-align:center; padding:100px 20px; }
  .signin-screen .app-title { font-size:30px; }
  .signin-screen p { color:var(--slate-soft); font-size:13.5px; margin:8px 0 26px; }

  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--slate-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; font-weight:700; }
  input, select { font-size:13px; padding:7px 10px; border:1px solid #cbd5e1; border-radius:7px; font-family:inherit; }
  .admin-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft); }
  .admin-form label { font-size:12px; color:var(--slate-soft); display:flex; align-items:center; gap:4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:18px 20px; box-shadow:var(--shadow); }
  .section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); margin:0 0 4px; }

  .back-link { color:var(--blue); cursor:pointer; font-size:12.5px; font-weight:600; margin-bottom:12px; display:inline-block; }
  .back-link:hover { text-decoration:underline; }
  .po-search { width:100%; max-width:340px; margin-bottom:14px; }
  .row-link { color:var(--blue); cursor:pointer; font-weight:700; }
  .row-link:hover { text-decoration:underline; }
  .status-pill { display:inline-block; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; }
  .status-ordered { background:var(--amber-soft); color:#92400e; }
  .status-material_inwarded { background:var(--blue-soft); color:#1e40af; }
  .status-received_in_inventory { background:var(--green-soft); color:#166534; }
  .flag-badge { display:inline-block; font-size:10px; font-weight:700; border-radius:999px; padding:2px 8px; margin-left:6px; background:var(--red-soft); color:#991b1b; }

  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:36px 16px; overflow:auto; }
  .modal-backdrop.open { display:flex; }
  .modal { background:#fff; border-radius:14px; max-width:760px; width:100%; padding:24px 28px 28px; max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { margin:0 0 2px; font-size:19px; color:var(--navy); }
  .modal .close-btn { float:right; cursor:pointer; font-size:22px; color:#9ca3af; line-height:1; }
  .modal .close-btn:hover { color:var(--slate); }
  .modal-meta { font-size:12.5px; color:var(--slate-soft); margin-bottom:14px; }
  .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0; }
  @media (max-width:600px) { .field-grid { grid-template-columns:1fr; } }
  .field-block { background:var(--gray-soft); border-radius:10px; padding:12px 14px; }
  .field-block h4 { margin:0 0 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; }
  .field-block div.line { font-size:13px; margin-bottom:3px; color:var(--slate); }
  .items-table { width:100%; border-collapse:collapse; margin-top:6px; font-size:12.5px; }
  .items-table th, .items-table td { border-bottom:1px solid var(--border); padding:6px 8px; text-align:left; }
  .flags-box { background:var(--red-soft); border:1px solid #fecaca; border-radius:10px; padding:12px 14px; margin-top:14px; }
  .flags-box h4 { margin:0 0 8px; font-size:10.5px; text-transform:uppercase; color:#991b1b; font-weight:700; }
  .flags-box li { font-size:12.5px; margin-bottom:5px; color:#7f1d1d; }
  .correction-box { background:var(--gray-soft); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-top:14px; }
  .correction-box h4 { margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; }
  .correction-box textarea { width:100%; min-height:52px; resize:vertical; font-family:inherit; }
  .correction-status { font-size:12px; margin-top:8px; font-weight:600; }
  .correction-status.ok { color:var(--green); }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="load-banner"><div class="spinner"></div><div>Loading&hellip;</div></div>
  </div>

  <script>
    const root = document.getElementById('root');
    let currentTab = 'dashboard';

    function getCookie(name) {
      const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return match ? match.pop() : '';
    }

    async function api(path, opts) {
      opts = opts || {};
      const method = (opts.method || 'GET').toUpperCase();
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      // Django's CSRF protection is on for every POST/PUT/DELETE - the
      // ensure_csrf_cookie wrapper on the index view (see core/urls.py)
      // guarantees this cookie exists, we just read it back here.
      if (method !== 'GET' && method !== 'HEAD') {
        headers['X-CSRFToken'] = getCookie('csrftoken');
      }
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      if (res.status === 401) { showSignIn(); throw new Error('not signed in'); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
      return data;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    function formatInr(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

    function showSignIn() {
      root.innerHTML =
        '<div class="signin-screen">' +
          '<h1 class="app-title">Purchase Tracker</h1>' +
          '<p>Ravasco Transmission and Packing</p>' +
          '<a class="btn" href="/auth/google">Sign in with Google</a>' +
        '</div>';
    }

    async function init() {
      try {
        const access = await api('/api/me');
        renderShell(access);
      } catch (e) {
        if (e.message !== 'not signed in') {
          root.innerHTML = '<div class="noaccess">Something went wrong loading your account. Please refresh, or contact IT if this keeps happening.</div>';
        }
      }
    }

    function renderShell(access) {
      if (access.role === 'none') {
        root.innerHTML =
          '<div class="topbar"><h1 class="app-title">Purchase Tracker</h1></div>' +
          '<div class="noaccess">You\'re signed in as ' + escapeHtml(access.email) + ', but nobody has given this account access yet. Ask an admin to add you.</div>';
        return;
      }
      const isAdmin = access.role === 'admin';
      const scopeLabel = access.role === 'admin' ? 'All plants' : (access.plants || []).join(', ');
      root.innerHTML =
        '<div class="topbar">' +
          '<h1 class="app-title">Purchase Tracker</h1>' +
          '<div class="who">' +
            '<span>' + escapeHtml(access.email) + '</span>' +
            '<span class="badge">' + escapeHtml(scopeLabel) + '</span>' +
            '<button class="btn secondary small" onclick="logout()">Sign out</button>' +
          '</div>' +
        '</div>' +
        (isAdmin ? '<div class="tabs"><div id="tab-dashboard" class="tab active" onclick="switchTab(\'dashboard\')">Dashboard</div><div id="tab-admin" class="tab" onclick="switchTab(\'admin\')">Admin</div></div>' : '') +
        '<div id="tab-content"></div>';
      currentTab = 'dashboard';
      loadDashboard();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('tab-' + tab);
      if (btn) btn.classList.add('active');
      if (tab === 'dashboard') loadDashboard();
      else loadAdmin();
    }

    async function loadDashboard() {
      const el = document.getElementById('tab-content');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading plant data&hellip;</div></div>';
      try {
        const data = await api('/api/dashboard');
        if (!data.plants.length) {
          el.innerHTML = '<div class="noaccess">No plants to show for this account yet.</div>';
          return;
        }
        el.innerHTML = '<div class="plant-grid">' + data.plants.map(renderPlantCard).join('') + '</div>';
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load the dashboard right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    function renderPlantCard(p) {
      // Any file-read issues (e.g. a Drive file being temporarily
      // unreachable) show as one short, plain-language line here - never
      // raw error text. See core/views.py's _safe_call for where these
      // messages are generated server-side.
      const noticeHtml = p.errors.length
        ? p.errors.map(e => '<div class="notice-banner">' + escapeHtml(e) + '</div>').join('')
        : '';
      return '<div class="plant-card" style="cursor:pointer" onclick="openPlantPos(\'' + p.plant + '\')">' +
        '<div class="plant-name">' + escapeHtml(plantLabel(p.plant)) + '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat"><div class="val">' + p.poCount + '</div><div class="label">Domestic POs</div></div>' +
          '<div class="stat"><div class="val">' + formatInr(p.totalValue) + '</div><div class="label">Total PO Value</div></div>' +
          '<div class="stat"><div class="val">' + p.mirRowCount + '</div><div class="label">MIR Rows</div></div>' +
          '<div class="stat"><div class="val">' + p.stockRowCount + '</div><div class="label">RM Stock Rows</div></div>' +
        '</div>' + noticeHtml +
      '</div>';
    }

    // --- Purchase Order list + drill-down (per plant) ------------------

    let currentPlant = null;
    let currentPos = [];

    async function openPlantPos(plant) {
      currentPlant = plant;
      const el = document.getElementById('tab-content');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading purchase orders&hellip;</div></div>';
      try {
        const data = await api('/api/plants/' + plant + '/purchase-orders');
        currentPos = data.purchaseOrders;
        renderPoList();
      } catch (e) {
        el.innerHTML = '<div class="back-link" onclick="loadDashboard()">&larr; Back to dashboard</div>' +
          '<div class="noaccess">Couldn\'t load purchase orders right now. Please try again, or contact IT if this keeps happening.</div>';
      }
    }

    function renderPoList(searchTerm) {
      const el = document.getElementById('tab-content');
      searchTerm = (searchTerm || '').toLowerCase();
      const filtered = !searchTerm ? currentPos : currentPos.filter(po =>
        (po.poNumber + ' ' + po.vendorName).toLowerCase().includes(searchTerm)
      );

      if (!currentPos.length) {
        el.innerHTML = '<div class="back-link" onclick="loadDashboard()">&larr; Back to dashboard</div>' +
          '<div class="noaccess">No purchase orders for ' + escapeHtml(plantLabel(currentPlant)) +
          ' yet - the extraction pipeline hasn\'t loaded any in, or none exist for this plant.</div>';
        return;
      }

      const rows = filtered.map((po, i) => {
        const originalIndex = currentPos.indexOf(po);
        const flagCount = (po.flags || []).filter(f => !f.resolved).length;
        return '<tr>' +
          '<td><span class="row-link" onclick="openPoModal(' + originalIndex + ')">' + escapeHtml(po.poNumber) + '</span></td>' +
          '<td>' + escapeHtml(po.vendorName || '—') + '</td>' +
          '<td>' + escapeHtml(po.createdDate || '—') + '</td>' +
          '<td>' + (po.totalInclTax != null ? formatInr(po.totalInclTax) : '—') + '</td>' +
          '<td><span class="status-pill status-' + po.status + '">' + escapeHtml((po.status || '').replace(/_/g, ' ')) + '</span>' +
            (flagCount ? '<span class="flag-badge">' + flagCount + '</span>' : '') + '</td>' +
        '</tr>';
      }).join('');

      el.innerHTML =
        '<div class="back-link" onclick="loadDashboard()">&larr; Back to dashboard</div>' +
        '<div class="card">' +
          '<div class="section-title">' + escapeHtml(plantLabel(currentPlant)) + ' - Purchase Orders</div>' +
          '<input class="po-search" placeholder="Search PO number or vendor&hellip;" oninput="renderPoList(this.value)">' +
          '<table><thead><tr><th>PO Number</th><th>Vendor</th><th>Date</th><th>Value (incl. tax)</th><th>Status</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>' +
        '</div>';
    }

    function openPoModal(index) {
      const po = currentPos[index];
      const flagsHtml = (po.flags || []).length
        ? '<div class="flags-box"><h4>Flags</h4><ul style="margin:0;padding-left:18px;">' +
            po.flags.map(f => '<li>' + escapeHtml(f.text) + (f.resolved ? ' (resolved)' : '') + '</li>').join('') +
          '</ul></div>'
        : '';
      const itemsHtml = (po.items || []).length
        ? '<table class="items-table"><thead><tr><th>Description</th><th>Qty</th><th>UOM</th><th>Net Price</th></tr></thead><tbody>' +
            po.items.map(it => '<tr><td>' + escapeHtml(it.description || '') + '</td><td>' + (it.qty != null ? it.qty : '—') +
              '</td><td>' + escapeHtml(it.uom || '') + '</td><td>' + (it.netPrice != null ? formatInr(it.netPrice) : '—') + '</td></tr>').join('') +
          '</tbody></table>'
        : '<div style="font-size:12.5px;color:var(--slate-soft);">No line items recorded.</div>';

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop open';
      backdrop.id = 'po-modal-backdrop';
      backdrop.onclick = (e) => { if (e.target === backdrop) closePoModal(); };
      backdrop.innerHTML =
        '<div class="modal">' +
          '<span class="close-btn" onclick="closePoModal()">&times;</span>' +
          '<h2>' + escapeHtml(po.poNumber) + '</h2>' +
          '<div class="modal-meta">' + escapeHtml(po.vendorName || 'Unknown vendor') + ' &middot; ' + escapeHtml(po.createdDate || 'no date') + '</div>' +
          '<div class="field-grid">' +
            '<div class="field-block"><h4>Vendor</h4>' +
              '<div class="line">' + escapeHtml(po.vendorName || '—') + '</div>' +
              '<div class="line">GSTIN: ' + escapeHtml(po.vendorGstin || '—') + '</div>' +
            '</div>' +
            '<div class="field-block"><h4>Commercials</h4>' +
              '<div class="line">Total incl. tax: ' + (po.totalInclTax != null ? formatInr(po.totalInclTax) : '—') + '</div>' +
              '<div class="line">Payment terms: ' + escapeHtml(po.paymentTerms || '—') + '</div>' +
              '<div class="line">Incoterms: ' + escapeHtml(po.incoterms || '—') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="section-title">Items</div>' + itemsHtml +
          flagsHtml +
          '<div class="correction-box">' +
            '<h4>Spot something wrong? Flag it</h4>' +
            '<textarea id="correction-text" placeholder="e.g. Quantity should be 5000 KG, not 500 KG"></textarea>' +
            '<div style="margin-top:8px;"><button class="btn small" onclick="submitCorrection(\'' + po.poNumber + '\')">Submit</button></div>' +
            '<div id="correction-status" class="correction-status"></div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(backdrop);
    }

    function closePoModal() {
      const el = document.getElementById('po-modal-backdrop');
      if (el) el.remove();
    }

    async function submitCorrection(poNumber) {
      const text = document.getElementById('correction-text').value.trim();
      const statusEl = document.getElementById('correction-status');
      if (!text) { statusEl.className = 'correction-status'; statusEl.textContent = 'Please describe what looks wrong first.'; return; }
      try {
        await api('/api/purchase-orders/' + encodeURIComponent(poNumber) + '/flags', {
          method: 'POST', body: JSON.stringify({ flagText: text })
        });
        statusEl.className = 'correction-status ok';
        statusEl.textContent = 'Submitted - thank you.';
        document.getElementById('correction-text').value = '';
      } catch (e) {
        statusEl.className = 'correction-status';
        statusEl.textContent = e.message || 'Could not submit right now, please try again.';
      }
    }

    function plantLabel(code) {
      return { HRS: 'HRS', RTP_ACHHAD: 'RTP - Achhad', RTP_VAPI: 'RTP - Vapi' }[code] || code;
    }

    async function loadAdmin() {
      const el = document.getElementById('tab-content');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading users&hellip;</div></div>';
      try {
        const data = await api('/api/admin/users');
        const rows = data.users.map(u => '<tr>' +
          '<td>' + escapeHtml(u.email) + '</td>' +
          '<td>' + escapeHtml(u.role) + '</td>' +
          '<td>' + escapeHtml((u.plants || []).join(', ') || (u.role === 'admin' ? 'All plants' : '—')) + '</td>' +
          '<td><button class="btn secondary small" onclick="removeUser(\'' + escapeHtml(u.email) + '\')">Remove</button></td>' +
        '</tr>').join('');
        const roleOptions = data.validRoles.map(r => '<option value="' + r + '">' + r + '</option>').join('');
        const plantChecks = data.plants.map(p => '<label><input type="checkbox" value="' + p + '" class="plant-check"> ' + escapeHtml(plantLabel(p)) + '</label>').join(' ');
        el.innerHTML =
          '<div class="card">' +
            '<div class="section-title">Users</div>' +
            '<table><thead><tr><th>Email</th><th>Role</th><th>Plants</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="admin-form">' +
              '<input id="new-email" placeholder="email@ravasco.com" style="width:220px;">' +
              '<select id="new-role">' + roleOptions + '</select>' +
              plantChecks +
              '<button class="btn small" onclick="addUser()">Add / Update</button>' +
            '</div>' +
            '<div id="admin-err"></div>' +
          '</div>' +
          renderTaskRunnerCard();
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load the user list right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    // --- Manual task runner ---------------------------------------------
    // Buttons for the 5 whitelisted management commands, since Render's
    // Shell tab and one-off Job runner are both paid-tier and unavailable on
    // this plan (see views.py's run_task). These same tasks also run on a
    // schedule via a free external scheduler hitting the token-authed URL -
    // this panel is just the manual/on-demand path for an admin.
    const RUNNABLE_TASKS = [
      { name: 'backfill_from_master_csv', label: 'Backfill POs from master CSVs' },
      { name: 'scan_new_pos', label: 'Scan Drive for new POs' },
      { name: 'ingest_extraction_results', label: 'Ingest extraction results' },
      { name: 'snapshot_rm_stock', label: 'Take RM Stock snapshot' },
      { name: 'refresh_plant_file_status', label: 'Refresh MIR/Stock dashboard cache' },
    ];

    function renderTaskRunnerCard() {
      const rows = RUNNABLE_TASKS.map(t =>
        '<tr><td>' + escapeHtml(t.label) + '</td><td style="font-family:var(--mono);font-size:11.5px;color:var(--slate-soft);">' + t.name + '</td>' +
        '<td><button class="btn secondary small" id="run-btn-' + t.name + '" onclick="runTask(\'' + t.name + '\')">Run now</button></td></tr>'
      ).join('');
      return '<div class="card" style="margin-top:16px;">' +
        '<div class="section-title">Scheduled Tasks (manual run)</div>' +
        '<div style="font-size:12px;color:var(--slate-soft);margin-bottom:8px;">These same jobs also run automatically on a schedule. Use this only to run one immediately - e.g. after loading new files onto Drive.</div>' +
        '<table><thead><tr><th>Task</th><th>Command</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div id="task-output" style="margin-top:12px;"></div>' +
      '</div>';
    }

    async function runTask(name) {
      const btn = document.getElementById('run-btn-' + name);
      const outEl = document.getElementById('task-output');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Running…';
      outEl.innerHTML = '<div class="notice-banner info">Running ' + escapeHtml(name) + '&hellip;</div>';
      try {
        const data = await api('/api/tasks/run/' + encodeURIComponent(name), { method: 'POST' });
        const bannerClass = data.success ? 'notice-banner info' : 'notice-banner';
        outEl.innerHTML =
          '<div class="' + bannerClass + '">' + (data.success ? 'Finished: ' : 'Finished with errors: ') + escapeHtml(name) + '</div>' +
          (data.stdout ? '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--gray-soft);border-radius:8px;padding:10px 12px;margin-top:8px;max-height:260px;overflow:auto;">' + escapeHtml(data.stdout) + '</pre>' : '') +
          (data.stderr ? '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--red-soft);color:#7f1d1d;border-radius:8px;padding:10px 12px;margin-top:8px;max-height:260px;overflow:auto;">' + escapeHtml(data.stderr) + '</pre>' : '');
      } catch (e) {
        outEl.innerHTML = '<div class="notice-banner">Could not run this task: ' + escapeHtml(e.message || 'unknown error') + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    async function addUser() {
      const email = document.getElementById('new-email').value.trim();
      const role = document.getElementById('new-role').value;
      const plants = Array.from(document.querySelectorAll('.plant-check:checked')).map(c => c.value);
      const errEl = document.getElementById('admin-err');
      errEl.innerHTML = '';
      try {
        await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ email, role, plants }) });
        loadAdmin();
      } catch (e) {
        errEl.innerHTML = '<div class="notice-banner">' + escapeHtml(e.message) + '</div>';
      }
    }

    async function removeUser(email) {
      if (!confirm('Remove access for ' + email + '?')) return;
      try {
        await api('/api/admin/users/' + encodeURIComponent(email), { method: 'DELETE' });
        loadAdmin();
      } catch (e) {
        alert('Could not remove this user. Please try again.');
      }
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' });
      location.reload();
    }

    init();
  </script>
</body>
</html>
