<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" crossorigin="anonymous"></script>
<style>
  /* CSS below is copied verbatim from the original Cowork "Purchase Tracker"
     artifact (C:\Users\Admin\Claude\Artifacts\purchase-tracker\index.html),
     so this page is visually identical to it, not a re-guessed approximation.
     A few extra rules at the bottom (signin-screen, admin/task-runner panel,
     status-material_inwarded/received_in_inventory pills) are additions this
     Django app needs that the artifact didn't - it never had a login screen
     or an admin/task-runner panel. */
  :root {
    color-scheme: light;
    --navy: #0f1b2d;
    --navy-hover: #182a44;
    --on-accent: #ffffff;
    --slate: #1f2937;
    --slate-soft: #475569;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;
    --bg: #f4f6f9;
    --card: #ffffff;
    --gray-soft: #f1f5f9;
    --blue: #2563eb;
    --blue-soft: #eff4ff;
    --red: #dc2626;
    --red-soft: #fef2f2;
    --amber: #d97706;
    --amber-soft: #fffbeb;
    --green: #16a34a;
    --green-soft: #f0fdf4;
    --indigo: #6366f1;
    --indigo-soft: #e0e7ff;
    --purple: #7c3aed;
    --purple-soft: #f3e8ff;
    --gray: #64748b;
    --gray-mid-soft: #eef1f5;
    --mono: ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 2px 8px rgba(15,23,42,0.05);
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { width:100%; overflow-x:hidden; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--slate); line-height:1.45; }
  .wrap { width:100%; max-width: 1600px; margin: 0 auto; padding: 22px clamp(12px, 2.5vw, 26px) 60px; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--border); }
  .app-title { font-size:26px; margin:0; color:var(--navy); font-weight:800; letter-spacing:-0.015em; }
  .who { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--slate-soft); flex-wrap:wrap; }
  .badge { display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--blue-soft); color:#1e40af; font-weight:700; }
  .btn { border:1px solid var(--navy); background:var(--navy); color:var(--on-accent); padding:8px 16px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; box-shadow:var(--shadow); }
  .btn:hover { background:var(--navy-hover); }
  .btn.secondary { background:#fff; color:var(--navy); }
  .btn.secondary:hover { background:var(--blue-soft); }
  .btn.small { padding:5px 12px; font-size:12px; }

  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { padding:10px 20px; cursor:pointer; font-size:13.5px; font-weight:700; border-radius:9px; color:var(--slate-soft); background:var(--card); border:1px solid var(--border); }
  .tab.active { color:var(--on-accent); background:var(--navy); border-color:var(--navy); }

  .load-banner { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:48px 20px; text-align:center; color:var(--slate-soft); font-size:14px; margin-bottom:18px; box-shadow:var(--shadow); }
  .spinner { display:inline-block; width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice-banner { background:var(--amber-soft); border:1px solid #fde68a; color:#92400e; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-top:10px; }
  .notice-banner.info { background:var(--blue-soft); border-color:#dbeafe; color:#1e40af; }
  .error-banner { background:var(--red-soft); border:1px solid #fecaca; color:#991b1b; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:14px; }
  .noaccess { background:var(--amber-soft); border:1px solid #fde68a; border-radius:12px; padding:20px 22px; color:#92400e; font-size:13.5px; }

  .view-tabs { display:flex; gap:8px; margin-bottom:18px; }
  .view-tab { padding:10px 20px; cursor:pointer; font-size:13.5px; font-weight:700; border-radius:9px; color:var(--slate-soft); background:var(--card); border:1px solid var(--border); }
  .view-tab.active { color:var(--on-accent); background:var(--navy); border-color:var(--navy); }

  .plant-tabs { display:flex; gap:6px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
  .plant-tab { padding: 9px 18px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--slate-soft); border-bottom: 2px solid transparent; margin-bottom:-2px; }
  .plant-tab.active { color:var(--navy); border-bottom-color:var(--blue); }
  .sub-tabs { display:flex; gap:4px; margin-bottom:18px; }
  .sub-tab { padding:6px 14px; font-size:12.5px; border-radius:7px; cursor:pointer; background:var(--gray-soft); color:var(--slate-soft); font-weight:600; }
  .sub-tab.active { background:var(--navy); color:var(--on-accent); }

  .filter-row { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px 15px; box-shadow:var(--shadow); }
  .filter-row label { font-size:12px; color:var(--slate-soft); font-weight:600; }
  .filter-row input[type=date], .filter-row input[type=text] { padding:6px 9px; border:1px solid #cbd5e1; border-radius:7px; font-size:12.5px; }
  .filter-row button { padding:6px 13px; border-radius:7px; border:1px solid #cbd5e1; background:#fff; cursor:pointer; font-size:12px; font-weight:600; color:var(--slate); }
  .filter-row button.primary { background:var(--navy); color:var(--on-accent); border-color:var(--navy); }

  .kpi-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:14px; margin-bottom:20px; }
  .kpi-card { background:var(--card); border:1px solid var(--border); border-left:5px solid #cbd5e1; border-radius:13px; padding:16px 18px; cursor:pointer; transition: box-shadow .15s, transform .15s; box-shadow:var(--shadow); }
  .kpi-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(15,23,42,0.10); }
  .kpi-card.active { outline:2px solid var(--navy); outline-offset:-1px; }
  .kpi-card .val { font-family:var(--mono); font-size:28px; font-weight:800; line-height:1.1; color:var(--navy); font-variant-numeric: tabular-nums; }
  .kpi-card .label { font-size:11px; color:var(--slate-soft); margin-top:7px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  .chart-row { display:grid; grid-template-columns: minmax(280px, 1.3fr) minmax(240px, 1fr); gap:16px; margin-bottom:20px; }
  @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-panel { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:16px 18px; box-shadow:var(--shadow); }
  .chart-panel h4 { margin:0 0 10px; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; }
  .chart-box { position:relative; height:220px; }
  .no-data-note { color:#9ca3af; font-size:12px; font-style:italic; }
  .chart-hint { font-size:11px; color:#9ca3af; margin-top:6px; text-align:center; font-style:italic; }

  .list-toggle-row { display:flex; align-items:center; justify-content:space-between; margin: 20px 0 10px; }
  .view-all-btn { padding:7px 15px; border-radius:8px; border:1px solid var(--navy); background:#fff; color:var(--navy); font-size:12px; font-weight:700; cursor:pointer; }
  .view-all-btn:hover { background:var(--blue-soft); }

  .section-title { font-size:14.5px; font-weight:700; margin: 20px 0 10px; color:var(--navy); }
  .section-sub { font-size:12px; color:var(--slate-soft); margin:-6px 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border-soft); }
  th { color:var(--slate-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; font-weight:700; }
  input, select { font-size:13px; padding:7px 10px; border:1px solid #cbd5e1; border-radius:7px; font-family:inherit; }
  .table-wrap { border-radius:10px; overflow-x:auto; border:1px solid var(--border); box-shadow:var(--shadow); background:var(--card); }
  .po-search { width:100%; max-width:340px; margin-bottom:14px; }

  .status-pill { display:inline-block; padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; }
  .status-received { background:var(--green-soft); color:#166534; }
  .status-partial { background:#fff7ed; color:#9a3412; }
  .status-pending { background:var(--amber-soft); color:#92400e; }
  .status-overdue { background:var(--red-soft); color:#991b1b; }
  .status-unknown { background:var(--indigo-soft); color:#3730a3; }
  .flag-badge { display:inline-block; font-size:10px; font-weight:700; border-radius:99px; padding:2px 8px; margin-left:6px; background:var(--red-soft); color:#991b1b; }
  .row-link { color:var(--blue); cursor:pointer; text-decoration:none; font-weight:700; font-size:12px; }
  .row-link:hover { text-decoration:underline; }
  .empty-state { padding:70px 20px; text-align:center; color:#9ca3af; font-size:14px; background:var(--card); border:1px dashed #d1d5db; border-radius:12px; }
  .back-link { color:var(--blue); cursor:pointer; font-size:12.5px; font-weight:600; margin-bottom:12px; display:inline-block; }
  .back-link:hover { text-decoration:underline; }

  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding: 36px 16px; overflow:auto; }
  .modal-backdrop.open { display:flex; }
  .modal { background:#fff; border-radius:14px; max-width: 900px; width:100%; padding:26px 32px 32px; max-height: 92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { margin:0 0 2px; font-size:20px; color:var(--navy); }
  .modal .close-btn { float:right; cursor:pointer; font-size:22px; color:#9ca3af; line-height:1; }
  .modal .close-btn:hover { color:var(--slate); }
  .modal-meta { font-size:12.5px; color:var(--slate-soft); margin-bottom:6px; }
  .modal-tabs { display:flex; gap:6px; margin:16px 0 18px; border-bottom:2px solid var(--border); flex-wrap:wrap; }
  .modal-tab { padding:9px 18px; font-size:13px; font-weight:700; color:var(--slate-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; white-space:nowrap; }
  .modal-tab:hover { color:var(--navy); }
  .modal-tab.active { color:var(--navy); border-bottom-color:var(--blue); }
  .modal-tab-panel { display:none; }
  .modal-tab-panel.active { display:block; animation: fadeIn .12s ease; }
  @keyframes fadeIn { from { opacity:0.4; } to { opacity:1; } }
  .field-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top:4px; }
  @media (max-width: 720px) { .field-grid { grid-template-columns: 1fr; } }
  .field-block { background:var(--gray-soft); border-radius:10px; padding:14px 16px; }
  .field-block h4 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--slate-soft); font-weight:700; }
  .field-block div.line { font-size:13px; margin-bottom:3px; color:var(--slate); font-family:var(--mono); }
  .items-table { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; font-family:var(--mono); }
  .items-table th, .items-table td { border-bottom:1px solid var(--border); padding:5px 7px; text-align:left; }
  .items-table th { color:var(--slate-soft); font-family:-apple-system,BlinkMacSystemFont,sans-serif; text-transform:uppercase; font-size:10.5px; letter-spacing:0.03em; }
  .flags-box { background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:12px 14px; margin-top:14px; }
  .flags-box h4 { margin:0 0 8px; font-size:11px; text-transform:uppercase; color:#9a3412; font-weight:700; }
  .flags-box li { font-size:12.5px; margin-bottom:5px; }
  .correction-box { background:var(--gray-soft); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-top:14px; }
  .correction-box h4 { margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; }
  .correction-box textarea { width:100%; min-height:52px; resize:vertical; font-family:inherit; }
  .correction-status { font-size:12px; margin-top:8px; font-weight:600; }
  .correction-status.ok { color:var(--green); }
  .full-width { grid-column: 1 / -1; }
  .mat-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .mat-search { flex:1; min-width:220px; padding:9px 13px; border:1px solid #cbd5e1; border-radius:9px; font-size:13px; }
  .mat-cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:18px; }
  .kpi-card.unknown { border-left-color:var(--gray); }
  .kpi-card.unknown .val { color:var(--gray); }
  .material-chip { display:inline-block; background:var(--green-soft); color:#166534; font-size:11px; font-weight:600; border-radius:99px; padding:3px 10px; margin:2px 4px 2px 0; }
  .material-chip.unused { background:#f1f5f9; color:#475569; }
  .license-card { background:var(--card); border:1px solid var(--border); border-left:5px solid var(--indigo); border-radius:13px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .license-card-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .license-card-head h4 { margin:0; font-size:15px; font-family:var(--mono); color:var(--navy); }
  .license-stat-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-bottom:16px; }
  .license-stat { background:#f8fafc; border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .license-stat .lval { font-family:var(--mono); font-weight:700; font-size:13.5px; color:var(--navy); }
  .license-stat .llabel { font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; margin-top:3px; }
  .license-section-label { font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--slate-soft); font-weight:700; margin:14px 0 8px; }
  .license-po-table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px; }
  .license-po-table th, .license-po-table td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  .license-po-table td.po-cell { font-family:var(--mono); font-weight:700; color:var(--navy); white-space:nowrap; }

  /* --- Additions beyond the artifact: sign-in screen, admin panel --- */
  .signin-screen { text-align:center; padding:100px 20px; }
  .signin-screen .app-title { font-size:30px; }
  .signin-screen p { color:var(--slate-soft); font-size:13.5px; margin:8px 0 26px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:18px 20px; box-shadow:var(--shadow); }
  .admin-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft); }
  .admin-form label { font-size:12px; color:var(--slate-soft); display:flex; align-items:center; gap:4px; }
  .status-material_inwarded { background:var(--blue-soft); color:#1e40af; }
  .status-received_in_inventory { background:var(--green-soft); color:#166534; }
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="load-banner"><div class="spinner"></div><div>Loading&hellip;</div></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBody"></div>
  </div>

  <script>
    const root = document.getElementById('root');
    let currentTab = 'dashboard';
    const PLANTS = ['HRS', 'RTP_ACHHAD', 'RTP_VAPI'];
    const PLANT_LABELS = { HRS: 'HRS', RTP_ACHHAD: 'RTP - Achhad', RTP_VAPI: 'RTP - Vapi' };
    let pageCharts = [];
    function destroyPageCharts() { pageCharts.forEach(c => { try { c.destroy(); } catch (e) {} }); pageCharts = []; }

    // Per-plant PO data cache and the small piece of UI state the Domestic PO
    // Tracker view needs - mirrors the state shape the artifact used, since
    // the interaction model (plant tabs -> sub tabs -> KPI cards that filter
    // the list -> chart row -> table -> drill-down modal) is being ported
    // as-is, just reading from Postgres via the API instead of parsing CSVs
    // live off Drive on every load.
    let DATA = { HRS: [], RTP_ACHHAD: [], RTP_VAPI: [] };
    let MATERIALS = { HRS: [], RTP_ACHHAD: [], RTP_VAPI: [] };
    let LICENSES = { HRS: [], RTP_ACHHAD: [], RTP_VAPI: [] };
    let state = {
      view: 'po', plant: 'HRS', sub: 'Domestic', statusFilter: null, from: null, to: null, showAllPOs: false,
      impSubView: 'pos',
      matPlant: 'HRS', matSearch: '', showAllMaterials: false,
    };

    function getCookie(name) {
      const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return match ? match.pop() : '';
    }

    async function api(path, opts) {
      opts = opts || {};
      const method = (opts.method || 'GET').toUpperCase();
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (method !== 'GET' && method !== 'HEAD') {
        headers['X-CSRFToken'] = getCookie('csrftoken');
      }
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      if (res.status === 401) { showSignIn(); throw new Error('not signed in'); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
      return data;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    function formatInr(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

    function showSignIn() {
      root.innerHTML =
        '<div class="signin-screen">' +
          '<h1 class="app-title">Purchase Tracker</h1>' +
          '<p>Ravasco Transmission and Packing</p>' +
          '<a class="btn" href="/auth/google">Sign in with Google</a>' +
        '</div>';
    }

    async function init() {
      try {
        const access = await api('/api/me');
        renderShell(access);
      } catch (e) {
        if (e.message !== 'not signed in') {
          root.innerHTML = '<div class="noaccess">Something went wrong loading your account. Please refresh, or contact IT if this keeps happening.</div>';
        }
      }
    }

    function renderShell(access) {
      if (access.role === 'none') {
        root.innerHTML =
          '<div class="topbar"><h1 class="app-title">Purchase Tracker</h1></div>' +
          '<div class="noaccess">You\'re signed in as ' + escapeHtml(access.email) + ', but nobody has given this account access yet. Ask an admin to add you.</div>';
        return;
      }
      const isAdmin = access.role === 'admin';
      const scopeLabel = access.role === 'admin' ? 'All plants' : (access.plants || []).join(', ');
      root.innerHTML =
        '<div class="topbar">' +
          '<h1 class="app-title">Purchase Tracker</h1>' +
          '<div class="who">' +
            '<span>' + escapeHtml(access.email) + '</span>' +
            '<span class="badge">' + escapeHtml(scopeLabel) + '</span>' +
            '<button class="btn secondary small" onclick="logout()">Sign out</button>' +
          '</div>' +
        '</div>' +
        (isAdmin ? '<div class="tabs"><div id="tab-dashboard" class="tab active" onclick="switchTab(\'dashboard\')">Dashboard</div><div id="tab-admin" class="tab" onclick="switchTab(\'admin\')">Admin</div></div>' : '') +
        '<div id="tab-content"></div>';
      currentTab = 'dashboard';
      loadDashboard();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('tab-' + tab);
      if (btn) btn.classList.add('active');
      if (tab === 'dashboard') loadDashboard();
      else loadAdmin();
    }

    // ------------------------------------------------------------------
    // Domestic/Import PO Tracker (view-tabs: PO Tracker / Materials /
    // Licenses - only PO Tracker has real data wired up so far, the other
    // two show an honest "not built yet" empty-state rather than fake data).
    // ------------------------------------------------------------------
    async function loadDashboard() {
      const el = document.getElementById('tab-content');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading plant data&hellip;</div></div>';
      try {
        await Promise.all(PLANTS.map(async p => {
          const data = await api('/api/plants/' + p + '/purchase-orders');
          DATA[p] = data.purchaseOrders;
        }));
        el.innerHTML = '<div class="view-tabs" id="viewTabs"></div><div id="viewContent"></div>';
        renderViewTabs();
        renderAll();
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load the dashboard right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    // Exactly the two top-level views the real artifact has - "Purchase
    // Orders" and "Raw Material Analysis". There is no separate top-level
    // Materials/Licenses tab; Licenses lives nested inside the Import
    // sub-tab instead (see renderPoContent).
    function renderViewTabs() {
      const el = document.getElementById('viewTabs');
      el.innerHTML =
        '<div class="view-tab ' + (state.view === 'po' ? 'active' : '') + '" data-view="po">Purchase Orders</div>' +
        '<div class="view-tab ' + (state.view === 'materials' ? 'active' : '') + '" data-view="materials">Raw Material Analysis</div>';
      el.querySelectorAll('.view-tab').forEach(t => t.onclick = () => { state.view = t.dataset.view; renderViewTabs(); renderAll(); });
    }

    function renderAll() {
      const el = document.getElementById('viewContent');
      if (state.view === 'po') {
        el.innerHTML = '<div class="plant-tabs" id="plantTabs"></div><div class="sub-tabs" id="subTabs"></div><div id="content"></div>';
        renderPlantTabs();
        renderSubTabs();
        renderPoContent();
      } else {
        el.innerHTML = '<div id="materialsContent"></div>';
        loadAndRenderMaterials();
      }
    }

    function renderPlantTabs() {
      const el = document.getElementById('plantTabs');
      el.innerHTML = PLANTS.map(p => '<div class="plant-tab ' + (p === state.plant ? 'active' : '') + '" data-plant="' + p + '">' + PLANT_LABELS[p] + '</div>').join('');
      el.querySelectorAll('.plant-tab').forEach(t => t.onclick = () => {
        state.plant = t.dataset.plant; state.statusFilter = null; state.showAllPOs = false; state.impSubView = 'pos';
        renderPlantTabs(); renderPoContent();
      });
    }

    function renderSubTabs() {
      const el = document.getElementById('subTabs');
      el.innerHTML = ['Domestic', 'Import'].map(s => '<div class="sub-tab ' + (s === state.sub ? 'active' : '') + '" data-sub="' + s + '">' + s + ' Purchases</div>').join('');
      el.querySelectorAll('.sub-tab').forEach(t => t.onclick = () => {
        state.sub = t.dataset.sub; state.statusFilter = null; state.showAllPOs = false; state.impSubView = 'pos';
        renderSubTabs(); renderPoContent();
      });
    }

    // Same 5-status model as the artifact (received / partial / pending /
    // overdue / unknown), computed from each item's delivery date. This is
    // the "no MIR match yet" branch of the original reconciliation logic -
    // real PO-vs-MIR item matching (which upgrades pending/overdue into
    // received/partial once a matching MIR row is found) is tracked as a
    // separate, still-pending piece of work, not silently skipped.
    const STATUS_LABELS = { received: 'Received', partial: 'Partial Delivered', pending: 'Pending', overdue: 'Overdue', unknown: 'Delivery Date Unknown' };
    function computeStatus(po) {
      const items = po.items || [];
      if (!items.length) return 'pending';
      const dates = items.map(it => it.deliveryDate).filter(Boolean).sort();
      if (!dates.length) return 'unknown';
      const dd = new Date(dates[0] + 'T00:00:00');
      const today = new Date(); today.setHours(0, 0, 0, 0);
      return (!isNaN(dd.getTime()) && dd < today) ? 'overdue' : 'pending';
    }

    function renderPoContent() {
      const el = document.getElementById('content');
      destroyPageCharts();
      const docType = state.sub === 'Domestic' ? 'domestic' : 'import';

      // Licenses is nested INSIDE the Import sub-tab, not a separate
      // top-level view - matches the real artifact's structure exactly.
      // Applies to every plant's Import sub-tab, not just RTP-Vapi - Advance
      // Licenses are an import-side concept generally, RTP-Vapi just
      // happens to be the only plant with import data extracted so far this
      // financial year (HRS/RTP-Achhad's Import folders are empty, not
      // architecturally excluded).
      if (docType === 'import') {
        const importSubTabsHtml =
          '<div class="sub-tabs" style="margin-bottom:14px;">' +
            '<div class="sub-tab ' + (state.impSubView === 'pos' ? 'active' : '') + '" id="impSubPos">Purchase Orders</div>' +
            '<div class="sub-tab ' + (state.impSubView === 'licenses' ? 'active' : '') + '" id="impSubLicenses">Licenses</div>' +
          '</div>';
        if (state.impSubView === 'licenses') {
          el.innerHTML = importSubTabsHtml + '<div id="licensesArea"><div class="load-banner"><div class="spinner"></div><div>Loading licenses&hellip;</div></div></div>';
          document.getElementById('impSubPos').onclick = () => { state.impSubView = 'pos'; renderPoContent(); };
          document.getElementById('impSubLicenses').onclick = () => { state.impSubView = 'licenses'; renderPoContent(); };
          loadAndRenderLicenses();
          return;
        }
        el.innerHTML = importSubTabsHtml + '<div id="poListArea"></div>';
        document.getElementById('impSubPos').onclick = () => { state.impSubView = 'pos'; renderPoContent(); };
        document.getElementById('impSubLicenses').onclick = () => { state.impSubView = 'licenses'; renderPoContent(); };
        renderPoList(document.getElementById('poListArea'), docType);
        return;
      }

      renderPoList(el, docType);
    }

    async function loadAndRenderLicenses() {
      const el = document.getElementById('licensesArea');
      const plant = state.plant;
      try {
        if (!LICENSES[plant].length) {
          const data = await api('/api/plants/' + plant + '/licenses');
          LICENSES[plant] = data.licenses;
        }
        if (!LICENSES[plant].length) {
          el.innerHTML = '<div class="no-data-note" style="padding:20px 0;">No Advance Authorisation licenses recorded yet for ' + escapeHtml(PLANT_LABELS[plant]) + ' - they get added once the extraction pipeline reads a license letter off Drive.</div>';
          return;
        }
        el.innerHTML = LICENSES[plant].map(renderLicenseCard).join('');
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load licenses right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    function renderLicenseCard(lic) {
      const poRows = lic.poUsages.length
        ? lic.poUsages.map(u => '<tr><td class="po-cell">' + escapeHtml(u.poNumber) + '</td><td>' + escapeHtml(u.materialDescription || '—') + '</td></tr>').join('')
        : '<tr><td colspan="2"><span class="no-data-note">No import PO currently linked to this license</span></td></tr>';
      const chips = lic.items.length
        ? lic.items.filter(i => i.itemType === 'input').map(i => '<span class="material-chip' + (i.consumedQty > 0 ? '' : ' unused') + '">' + escapeHtml(i.materialDescription) + (i.consumedQty > 0 ? ' (in use)' : '') + '</span>').join('')
        : '<div class="no-data-note">Not available yet.</div>';
      const today = new Date().toISOString().slice(0, 10);
      const expired = lic.exportObligationEnd && lic.exportObligationEnd < today;
      const pillClass = lic.eodcStatus === 'closed' ? 'received' : expired ? 'overdue' : 'pending';
      const pillLabel = lic.eodcStatus === 'closed' ? 'EODC Closed' : expired ? 'Expired' : 'Open';
      return '<div class="license-card">' +
        '<div class="license-card-head"><h4>Authorisation No. ' + escapeHtml(lic.licenseNumber) + '</h4>' +
          '<span class="status-pill status-' + pillClass + '">' + pillLabel + '</span></div>' +
        '<div class="license-stat-grid">' +
          '<div class="license-stat"><div class="lval">' + escapeHtml(lic.issueDate || 'Not extracted') + '</div><div class="llabel">Issue Date</div></div>' +
          '<div class="license-stat"><div class="lval">' + escapeHtml(lic.importValidityEnd || 'Not extracted') + '</div><div class="llabel">Import Validity</div></div>' +
          '<div class="license-stat"><div class="lval">' + escapeHtml(lic.exportObligationEnd || 'Not extracted') + '</div><div class="llabel">Export Obligation End</div></div>' +
          '<div class="license-stat"><div class="lval">' + (lic.totalAuthorisedCifValue != null ? formatInr(lic.totalAuthorisedCifValue) : 'Not extracted') + '</div><div class="llabel">Authorised CIF Value</div></div>' +
        '</div>' +
        '<div class="license-section-label">Material Raised Against (by PO)</div>' +
        '<table class="license-po-table"><tbody>' + poRows + '</tbody></table>' +
        '<div class="license-section-label">Material(s) It Can Be Raised Against</div>' +
        '<div>' + chips + '</div>' +
      '</div>';
    }

    function renderPoList(el, docType) {
      const all = (DATA[state.plant] || []).filter(po => po.docType === docType);
      all.forEach(po => { po._status = computeStatus(po); });

      if (!all.length) {
        el.innerHTML = '<div class="empty-state">No ' + state.sub.toLowerCase() + ' purchase orders for ' + escapeHtml(PLANT_LABELS[state.plant]) + ' yet.</div>';
        return;
      }

      const inRange = po => {
        if (state.from && (!po.createdDate || po.createdDate < state.from)) return false;
        if (state.to && (!po.createdDate || po.createdDate > state.to)) return false;
        return true;
      };
      const filtered = all.filter(inRange);
      const counts = { received: 0, partial: 0, pending: 0, overdue: 0, unknown: 0 };
      filtered.forEach(po => counts[po._status]++);
      const total = filtered.length;

      const cardDef = [
        { key: 'total', cls: '', label: "Total PO's Created", val: total },
        { key: 'received', cls: 'received', label: 'Material Inward / Received', val: counts.received },
        { key: 'partial', cls: 'partial', label: STATUS_LABELS.partial, val: counts.partial },
        { key: 'pending', cls: 'pending', label: 'Pending Deliveries', val: counts.pending },
        { key: 'overdue', cls: 'overdue', label: 'Overdue', val: counts.overdue },
        { key: 'unknown', cls: 'unknown', label: STATUS_LABELS.unknown, val: counts.unknown },
      ];
      const kpiHtml = cardDef.map(c => '<div class="kpi-card ' + c.cls + ' ' + (state.statusFilter === c.key ? 'active' : '') + '" data-kpi="' + c.key + '">' +
        '<div class="val">' + c.val + '</div><div class="label">' + escapeHtml(c.label) + '</div></div>').join('');

      let tableRecs = state.statusFilter && state.statusFilter !== 'total'
        ? filtered.filter(po => po._status === state.statusFilter)
        : filtered;
      tableRecs = tableRecs.slice().sort((a, b) => (b.createdDate || '').localeCompare(a.createdDate || ''));

      const statusChartData = [
        { label: STATUS_LABELS.received, val: counts.received, color: '#16a34a' },
        { label: STATUS_LABELS.partial, val: counts.partial, color: '#2563eb' },
        { label: STATUS_LABELS.pending, val: counts.pending, color: '#d97706' },
        { label: STATUS_LABELS.overdue, val: counts.overdue, color: '#dc2626' },
        { label: STATUS_LABELS.unknown, val: counts.unknown, color: '#64748b' },
      ].filter(s => s.val > 0);

      const monthTotals = {};
      filtered.forEach(po => {
        const m = (po.createdDate || '').slice(0, 7);
        const v = po.totalInclTax != null ? po.totalInclTax : po.totalValue;
        if (!m || v == null) return;
        monthTotals[m] = (monthTotals[m] || 0) + v;
      });
      const months = Object.keys(monthTotals).sort();

      const showingAll = state.showAllPOs;
      const totalForList = tableRecs.length;
      const listRecs = showingAll ? tableRecs : tableRecs.slice(0, 5);

      el.innerHTML =
        '<div class="filter-row">' +
          '<label>Date filter (Created on)</label>' +
          '<input type="date" id="fromDate" value="' + (state.from || '') + '">' +
          '<span style="color:#9ca3af;font-size:12px;">to</span>' +
          '<input type="date" id="toDate" value="' + (state.to || '') + '">' +
          '<button class="primary" id="applyFilter">Apply</button>' +
          '<button id="clearFilter">Clear</button>' +
        '</div>' +
        '<div class="kpi-grid">' + kpiHtml + '</div>' +
        ((statusChartData.length || months.length) ?
          '<div class="chart-row">' +
            '<div class="chart-panel"><h4>PO Value Trend by Month Created</h4>' +
              (months.length ? '<div class="chart-box"><canvas id="poTrendChart"></canvas></div>' : '<div class="no-data-note">No dated POs in range to plot.</div>') +
            '</div>' +
            '<div class="chart-panel"><h4>Status Breakdown</h4>' +
              (statusChartData.length ? '<div class="chart-box"><canvas id="poStatusChart"></canvas></div>' : '<div class="no-data-note">No POs in range.</div>') +
            '</div>' +
          '</div>' : '') +
        '<div class="list-toggle-row"><div class="section-title" style="margin:0;">Purchase Orders (' + totalForList + ')</div>' +
          (totalForList > 5 ? '<button class="view-all-btn" id="toggleAllBtn">' + (showingAll ? 'Show top 5' : 'View all') + '</button>' : '') +
        '</div>' +
        '<div class="table-wrap"><table><thead><tr><th>PO Number</th><th>Vendor</th><th>Date</th><th>Value (incl. tax)</th><th>Status</th></tr></thead>' +
        '<tbody>' + listRecs.map(po => {
          const flagCount = (po.flags || []).filter(f => !f.resolved).length;
          return '<tr><td><span class="row-link" data-po="' + escapeHtml(po.poNumber) + '">' + escapeHtml(po.poNumber) + '</span></td>' +
            '<td>' + escapeHtml(po.vendorName || '—') + '</td>' +
            '<td>' + escapeHtml(po.createdDate || '—') + '</td>' +
            '<td>' + (po.totalInclTax != null ? formatInr(po.totalInclTax) : '—') + '</td>' +
            '<td><span class="status-pill status-' + po._status + '">' + escapeHtml(STATUS_LABELS[po._status]) + '</span>' +
              (flagCount ? '<span class="flag-badge">' + flagCount + '</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';

      document.querySelectorAll('[data-kpi]').forEach(c => c.onclick = () => {
        const key = c.dataset.kpi;
        state.statusFilter = (state.statusFilter === key || key === 'total') ? null : key;
        renderPoContent();
      });
      document.getElementById('applyFilter').onclick = () => {
        state.from = document.getElementById('fromDate').value || null;
        state.to = document.getElementById('toDate').value || null;
        renderPoContent();
      };
      document.getElementById('clearFilter').onclick = () => { state.from = null; state.to = null; renderPoContent(); };
      const toggleBtn = document.getElementById('toggleAllBtn');
      if (toggleBtn) toggleBtn.onclick = () => { state.showAllPOs = !state.showAllPOs; renderPoContent(); };
      document.querySelectorAll('[data-po]').forEach(el2 => el2.onclick = () => openPoModal(el2.dataset.po, docType));

      if (months.length) {
        const ctx = document.getElementById('poTrendChart');
        pageCharts.push(new Chart(ctx, {
          type: 'bar',
          data: { labels: months, datasets: [{ data: months.map(m => monthTotals[m]), backgroundColor: '#2563eb' }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => '₹' + (v / 100000).toFixed(1) + 'L' } } } }
        }));
      }
      if (statusChartData.length) {
        const ctx = document.getElementById('poStatusChart');
        pageCharts.push(new Chart(ctx, {
          type: 'doughnut',
          data: { labels: statusChartData.map(s => s.label), datasets: [{ data: statusChartData.map(s => s.val), backgroundColor: statusChartData.map(s => s.color) }] },
          options: { plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
        }));
      }
    }

    function openPoModal(poNumber, docType) {
      const po = (DATA[state.plant] || []).find(p => p.poNumber === poNumber);
      if (!po) return;
      const flagsHtml = (po.flags || []).length
        ? '<div class="flags-box"><h4>Flags</h4><ul style="margin:0;padding-left:18px;">' +
            po.flags.map(f => '<li>' + escapeHtml(f.text) + (f.resolved ? ' (resolved)' : '') + '</li>').join('') +
          '</ul></div>' : '';
      const itemsHtml = (po.items || []).length
        ? '<table class="items-table"><thead><tr><th>Description</th><th>Qty</th><th>UOM</th><th>Net Price</th><th>Delivery Date</th></tr></thead><tbody>' +
            po.items.map(it => '<tr><td>' + escapeHtml(it.description || '') + '</td><td>' + (it.qty != null ? it.qty : '—') +
              '</td><td>' + escapeHtml(it.uom || '') + '</td><td>' + (it.netPrice != null ? formatInr(it.netPrice) : '—') +
              '</td><td>' + escapeHtml(it.deliveryDate || '—') + '</td></tr>').join('') + '</tbody></table>'
        : '<div style="font-size:12.5px;color:var(--slate-soft);">No line items recorded.</div>';

      const backdrop = document.getElementById('modalBackdrop');
      const body = document.getElementById('modalBody');
      backdrop.classList.add('open');
      backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
      body.innerHTML =
        '<span class="close-btn" onclick="closeModal()">&times;</span>' +
        '<h2>' + escapeHtml(po.poNumber) + '</h2>' +
        '<div class="modal-meta">' + escapeHtml(po.vendorName || 'Unknown vendor') + ' &middot; ' + escapeHtml(po.createdDate || 'no date') + '</div>' +
        '<div class="field-grid">' +
          '<div class="field-block"><h4>Vendor</h4>' +
            '<div class="line">' + escapeHtml(po.vendorName || '—') + '</div>' +
            '<div class="line">GSTIN: ' + escapeHtml(po.vendorGstin || '—') + '</div>' +
          '</div>' +
          '<div class="field-block"><h4>Commercials</h4>' +
            '<div class="line">Total incl. tax: ' + (po.totalInclTax != null ? formatInr(po.totalInclTax) : '—') + '</div>' +
            '<div class="line">Payment terms: ' + escapeHtml(po.paymentTerms || '—') + '</div>' +
            '<div class="line">Incoterms: ' + escapeHtml(po.incoterms || '—') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="section-title">Items</div>' + itemsHtml +
        flagsHtml +
        '<div class="correction-box">' +
          '<h4>Spot something wrong? Flag it</h4>' +
          '<textarea id="correction-text" placeholder="e.g. Quantity should be 5000 KG, not 500 KG"></textarea>' +
          '<div style="margin-top:8px;"><button class="btn small" onclick="submitCorrection(\'' + po.poNumber + '\')">Submit</button></div>' +
          '<div id="correction-status" class="correction-status"></div>' +
        '</div>';
    }

    function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); destroyPageCharts(); }

    // ------------------------------------------------------------------
    // Raw Material Analysis view - the artifact's second top-level tab.
    // Built off StockSnapshot (already real data in Postgres), one row per
    // material (latest snapshot only). Deliberately has NO "Open PO Lines"
    // or "MIR vs Stock Mismatch" cards yet - those need the PO-vs-MIR
    // reconciliation engine, a separate not-yet-built piece (see task #17),
    // and showing made-up numbers for them would be worse than omitting.
    // ------------------------------------------------------------------
    async function loadAndRenderMaterials() {
      const el = document.getElementById('materialsContent');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading materials&hellip;</div></div>';
      try {
        if (!MATERIALS[state.matPlant].length) {
          const data = await api('/api/plants/' + state.matPlant + '/materials');
          MATERIALS[state.matPlant] = data.materials;
        }
        renderMaterialsView();
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load material data right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    function renderMaterialsView() {
      const el = document.getElementById('materialsContent');
      destroyPageCharts();
      const all = MATERIALS[state.matPlant] || [];

      const catCounts = {};
      all.forEach(m => { catCounts[m.category || 'Uncategorized'] = (catCounts[m.category || 'Uncategorized'] || 0) + 1; });
      const catOptions = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);

      let filtered = all;
      if (state.matCategoryFilter) filtered = filtered.filter(m => (m.category || 'Uncategorized') === state.matCategoryFilter);
      if (state.matSearch) {
        const q = state.matSearch.toLowerCase();
        filtered = filtered.filter(m => (m.description || '').toLowerCase().includes(q));
      }

      const totalMaterials = filtered.length;
      const totalValue = filtered.reduce((s, m) => s + (m.value || 0), 0);
      const sorted = filtered.slice().sort((a, b) => (b.value || 0) - (a.value || 0));
      const showingAll = state.showAllMaterials;
      const listRecs = showingAll ? sorted : sorted.slice(0, 5);

      if (!all.length) {
        el.innerHTML =
          '<div class="plant-tabs" id="matPlantTabs">' + PLANTS.map(p => '<div class="plant-tab ' + (p === state.matPlant ? 'active' : '') + '" data-mplant="' + p + '">' + PLANT_LABELS[p] + '</div>').join('') + '</div>' +
          '<div class="empty-state">No RM Stock snapshot recorded yet for ' + escapeHtml(PLANT_LABELS[state.matPlant]) + ' - it gets populated by the daily snapshot job once it runs.</div>';
        bindMatPlantTabs();
        return;
      }

      el.innerHTML =
        '<div class="plant-tabs" id="matPlantTabs">' + PLANTS.map(p => '<div class="plant-tab ' + (p === state.matPlant ? 'active' : '') + '" data-mplant="' + p + '">' + PLANT_LABELS[p] + '</div>').join('') + '</div>' +
        '<div class="section-title">Raw Material and Inventory Analysis: ' + escapeHtml(PLANT_LABELS[state.matPlant]) + '</div>' +
        '<div class="section-sub">Latest RM Stock snapshot per material at this plant. Click a row for its stock trend over time.</div>' +
        '<div class="mat-cards">' +
          '<div class="kpi-card"><div class="val">' + totalMaterials + '</div><div class="label">Materials Tracked</div></div>' +
          '<div class="kpi-card"><div class="val">' + formatInr(totalValue) + '</div><div class="label">' + escapeHtml(PLANT_LABELS[state.matPlant]) + ' Inventory Value</div></div>' +
        '</div>' +
        '<div class="mat-toolbar">' +
          '<input type="text" class="mat-search" id="matSearchInput" placeholder="Search material name..." value="' + escapeHtml(state.matSearch || '') + '">' +
          '<select id="matCatSelect" class="mat-search" style="flex:none;min-width:220px;">' +
            '<option value="">All categories (' + all.length + ')</option>' +
            catOptions.map(([c, n]) => '<option value="' + escapeHtml(c) + '" ' + (state.matCategoryFilter === c ? 'selected' : '') + '>' + escapeHtml(c) + ' (' + n + ')</option>').join('') +
          '</select>' +
        '</div>' +
        '<div class="list-toggle-row"><div class="section-title" style="margin:0;">Materials by Inventory Value (' + sorted.length + ')</div>' +
          (sorted.length > 5 ? '<button class="view-all-btn" id="toggleMatBtn">' + (showingAll ? 'Show top 5' : 'View all') + '</button>' : '') +
        '</div>' +
        '<div class="table-wrap"><table><thead><tr><th>Material</th><th>Category</th><th>Stock Qty</th><th>Rate</th><th>Value</th></tr></thead><tbody>' +
        listRecs.map(m => '<tr><td><span class="row-link" data-mat="' + escapeHtml(m.materialCode) + '">' + escapeHtml(m.description || m.materialCode) + '</span></td>' +
          '<td>' + escapeHtml(m.category || '—') + '</td>' +
          '<td>' + (m.qty != null ? m.qty : '—') + '</td>' +
          '<td>' + (m.rate != null ? formatInr(m.rate) : '—') + '</td>' +
          '<td>' + (m.value != null ? formatInr(m.value) : '—') + '</td></tr>').join('') +
        '</tbody></table></div>';

      bindMatPlantTabs();
      document.getElementById('matSearchInput').oninput = (e) => { state.matSearch = e.target.value; renderMaterialsView(); };
      document.getElementById('matCatSelect').onchange = (e) => { state.matCategoryFilter = e.target.value || null; renderMaterialsView(); };
      const toggleBtn = document.getElementById('toggleMatBtn');
      if (toggleBtn) toggleBtn.onclick = () => { state.showAllMaterials = !state.showAllMaterials; renderMaterialsView(); };
      document.querySelectorAll('[data-mat]').forEach(el2 => el2.onclick = () => openMaterialModal(el2.dataset.mat));
    }

    function bindMatPlantTabs() {
      document.querySelectorAll('#matPlantTabs .plant-tab').forEach(t => t.onclick = () => {
        state.matPlant = t.dataset.mplant; state.matCategoryFilter = null; state.matSearch = ''; state.showAllMaterials = false;
        loadAndRenderMaterials();
      });
    }

    async function openMaterialModal(materialCode) {
      const mat = (MATERIALS[state.matPlant] || []).find(m => m.materialCode === materialCode);
      if (!mat) return;
      const backdrop = document.getElementById('modalBackdrop');
      const body = document.getElementById('modalBody');
      backdrop.classList.add('open');
      backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
      body.innerHTML =
        '<span class="close-btn" onclick="closeModal()">&times;</span>' +
        '<h2>' + escapeHtml(mat.description || mat.materialCode) + '</h2>' +
        '<div class="modal-meta">' + escapeHtml(mat.category || 'Uncategorized') + ' &middot; ' + escapeHtml(PLANT_LABELS[state.matPlant]) + '</div>' +
        '<div class="field-grid">' +
          '<div class="field-block"><h4>Current Stock</h4><div class="line">Qty: ' + (mat.qty != null ? mat.qty : '—') + '</div><div class="line">Rate: ' + (mat.rate != null ? formatInr(mat.rate) : '—') + '</div><div class="line">Value: ' + (mat.value != null ? formatInr(mat.value) : '—') + '</div></div>' +
          '<div class="field-block"><h4>As of</h4><div class="line">' + escapeHtml(mat.date || '—') + '</div></div>' +
        '</div>' +
        '<div class="section-title">Stock Trend</div>' +
        '<div class="chart-box" id="matTrendBox"><div class="no-data-note">Loading&hellip;</div></div>';

      try {
        const data = await api('/api/plants/' + state.matPlant + '/stock-trend?material_code=' + encodeURIComponent(materialCode));
        const trendBox = document.getElementById('matTrendBox');
        if (!data.snapshots.length) { trendBox.innerHTML = '<div class="no-data-note">Not enough daily snapshots yet to plot a trend.</div>'; return; }
        trendBox.innerHTML = '<canvas id="matTrendChart"></canvas>';
        pageCharts.push(new Chart(document.getElementById('matTrendChart'), {
          type: 'line',
          data: { labels: data.snapshots.map(s => s.date), datasets: [{ label: 'Qty', data: data.snapshots.map(s => s.qty), borderColor: '#2563eb', tension: 0.2 }] },
          options: { plugins: { legend: { display: false } } }
        }));
      } catch (e) {
        document.getElementById('matTrendBox').innerHTML = '<div class="no-data-note">Couldn\'t load the stock trend right now.</div>';
      }
    }

    async function submitCorrection(poNumber) {
      const text = document.getElementById('correction-text').value.trim();
      const statusEl = document.getElementById('correction-status');
      if (!text) { statusEl.className = 'correction-status'; statusEl.textContent = 'Please describe what looks wrong first.'; return; }
      try {
        await api('/api/purchase-orders/' + encodeURIComponent(poNumber) + '/flags', { method: 'POST', body: JSON.stringify({ flagText: text }) });
        statusEl.className = 'correction-status ok';
        statusEl.textContent = 'Submitted - thank you.';
        document.getElementById('correction-text').value = '';
      } catch (e) {
        statusEl.className = 'correction-status';
        statusEl.textContent = e.message || 'Could not submit right now, please try again.';
      }
    }

    // ------------------------------------------------------------------
    // Admin tab: user/role management + manual task runner
    // ------------------------------------------------------------------
    async function loadAdmin() {
      const el = document.getElementById('tab-content');
      el.innerHTML = '<div class="load-banner"><div class="spinner"></div><div>Loading users&hellip;</div></div>';
      try {
        const data = await api('/api/admin/users');
        const rows = data.users.map(u => '<tr>' +
          '<td>' + escapeHtml(u.email) + '</td>' +
          '<td>' + escapeHtml(u.role) + '</td>' +
          '<td>' + escapeHtml((u.plants || []).join(', ') || (u.role === 'admin' ? 'All plants' : '—')) + '</td>' +
          '<td><button class="btn secondary small" onclick="removeUser(\'' + escapeHtml(u.email) + '\')">Remove</button></td>' +
        '</tr>').join('');
        const roleOptions = data.validRoles.map(r => '<option value="' + r + '">' + r + '</option>').join('');
        const plantChecks = data.plants.map(p => '<label><input type="checkbox" value="' + p + '" class="plant-check"> ' + escapeHtml(PLANT_LABELS[p]) + '</label>').join(' ');
        el.innerHTML =
          '<div class="card">' +
            '<div class="section-title">Users</div>' +
            '<table><thead><tr><th>Email</th><th>Role</th><th>Plants</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="admin-form">' +
              '<input id="new-email" placeholder="email@ravasco.com" style="width:220px;">' +
              '<select id="new-role">' + roleOptions + '</select>' +
              plantChecks +
              '<button class="btn small" onclick="addUser()">Add / Update</button>' +
            '</div>' +
            '<div id="admin-err"></div>' +
          '</div>' +
          renderTaskRunnerCard();
      } catch (e) {
        el.innerHTML = '<div class="noaccess">Couldn\'t load the user list right now. Please refresh, or contact IT if this keeps happening.</div>';
      }
    }

    async function addUser() {
      const email = document.getElementById('new-email').value.trim();
      const role = document.getElementById('new-role').value;
      const plants = Array.from(document.querySelectorAll('.plant-check:checked')).map(c => c.value);
      const errEl = document.getElementById('admin-err');
      errEl.innerHTML = '';
      try {
        await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ email, role, plants }) });
        loadAdmin();
      } catch (e) {
        errEl.innerHTML = '<div class="notice-banner">' + escapeHtml(e.message) + '</div>';
      }
    }

    async function removeUser(email) {
      if (!confirm('Remove access for ' + email + '?')) return;
      try {
        await api('/api/admin/users/' + encodeURIComponent(email), { method: 'DELETE' });
        loadAdmin();
      } catch (e) {
        alert('Could not remove this user. Please try again.');
      }
    }

    const RUNNABLE_TASKS = [
      { name: 'backfill_from_master_csv', label: 'Backfill POs from master CSVs' },
      { name: 'scan_new_pos', label: 'Scan Drive for new POs' },
      { name: 'ingest_extraction_results', label: 'Ingest extraction results' },
      { name: 'snapshot_rm_stock', label: 'Take RM Stock snapshot' },
      { name: 'refresh_plant_file_status', label: 'Refresh MIR/Stock dashboard cache' },
      { name: 'list_master_csv_folder', label: 'List master CSV folder (diagnostic)' },
    ];

    function renderTaskRunnerCard() {
      const rows = RUNNABLE_TASKS.map(t =>
        '<tr><td>' + escapeHtml(t.label) + '</td><td style="font-family:var(--mono);font-size:11.5px;color:var(--slate-soft);">' + t.name + '</td>' +
        '<td><button class="btn secondary small" id="run-btn-' + t.name + '" onclick="runTask(\'' + t.name + '\')">Run now</button></td></tr>'
      ).join('');
      return '<div class="card" style="margin-top:16px;">' +
        '<div class="section-title">Scheduled Tasks (manual run)</div>' +
        '<div style="font-size:12px;color:var(--slate-soft);margin-bottom:8px;">These same jobs also run automatically on a schedule. Use this only to run one immediately - e.g. after loading new files onto Drive.</div>' +
        '<table><thead><tr><th>Task</th><th>Command</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div id="task-output" style="margin-top:12px;"></div>' +
      '</div>';
    }

    async function runTask(name) {
      const btn = document.getElementById('run-btn-' + name);
      const outEl = document.getElementById('task-output');
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Running…';
      outEl.innerHTML = '<div class="notice-banner info">Running ' + escapeHtml(name) + '&hellip;</div>';
      try {
        const data = await api('/api/tasks/run/' + encodeURIComponent(name), { method: 'POST' });
        const bannerClass = data.success ? 'notice-banner info' : 'notice-banner';
        outEl.innerHTML =
          '<div class="' + bannerClass + '">' + (data.success ? 'Finished: ' : 'Finished with errors: ') + escapeHtml(name) + '</div>' +
          (data.stdout ? '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--gray-soft);border-radius:8px;padding:10px 12px;margin-top:8px;max-height:260px;overflow:auto;">' + escapeHtml(data.stdout) + '</pre>' : '') +
          (data.stderr ? '<pre style="white-space:pre-wrap;font-size:11.5px;background:var(--red-soft);color:#7f1d1d;border-radius:8px;padding:10px 12px;margin-top:8px;max-height:260px;overflow:auto;">' + escapeHtml(data.stderr) + '</pre>' : '');
      } catch (e) {
        outEl.innerHTML = '<div class="notice-banner">Could not run this task: ' + escapeHtml(e.message || 'unknown error') + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    async function logout() {
      await fetch('/auth/logout', { method: 'POST' });
      location.reload();
    }

    init();
  </script>
</body>
</html>
