# Local dev. Builds the SAME Dockerfile Render deploys (render.yaml,
# runtime: docker), so what runs here is what runs in production.
# `docker compose up` gives a developer a real Postgres + this app running
# together without installing Python/uv/Postgres directly. See CLAUDE.md's
# "Deployment, Docker, and `.env`" and README.md's "Docker" for setup steps.
#
# Reuses .env.example as the single source of truth for app secrets/config
# (Google/SMTP/JWT vars etc.) - copy it to .env before running `docker
# compose up`, same first step as the non-Docker "Local setup" flow. DB
# connection details are set explicitly below (DATABASE_URL points at the
# `db` service, not localhost) rather than read from .env, so whatever
# PGHOST/DATABASE_URL happens to be in a developer's own .env (typically
# `localhost`, for running against a locally-installed Postgres instead of
# Docker) doesn't need to change to also work under Docker.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: purchase_tracker
      POSTGRES_USER: purchase_tracker
      POSTGRES_PASSWORD: purchase_tracker
    volumes:
      - pt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase_tracker -d purchase_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://purchase_tracker:purchase_tracker@db:5432/purchase_tracker
      # Runs release.sh (migrate, ensure_schedules, createcachetable) before
      # gunicorn starts - the local stand-in for render.yaml's
      # preDeployCommand. `app` only; the worker must not also migrate.
      RUN_RELEASE_TASKS: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://purchase_tracker:purchase_tracker@db:5432/purchase_tracker
    # Plain `python`, not `uv run python`: the venv is on PATH and root-owned,
    # and the container runs as a non-root user (see the Dockerfile).
    command: ["python", "manage.py", "qcluster"]
    # Can come up before `app` has finished migrating a fresh database; if
    # qcluster exits on a missing table, restart it rather than leave it down.
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pt_postgres_data:
